services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8004}:80"
    # El código se copia dentro de la imagen durante el build.
    # No usamos un bind mount del proyecto para evitar problemas de Docker Desktop
    # al montar carpetas ubicadas en unidades Windows como D:.
    volumes:
      - student_portal_vendor_data:/var/www/html/vendor
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-student_portal_db}
      DB_USER: ${DB_USER:-student_portal_user}
      DB_PASS: ${DB_PASS:?DB_PASS debe estar definido en .env}
      TZ: ${TZ:-America/La_Paz}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD debe estar definido en .env}
      MYSQL_DATABASE: ${DB_NAME:-student_portal_db}
      MYSQL_USER: ${DB_USER:-student_portal_user}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS debe estar definido en .env}
      TZ: ${TZ:-America/La_Paz}
    volumes:
      - student_portal_mysql_data:/var/lib/mysql
      - ./database/00_init_complete.sql:/docker-entrypoint-initdb.d/00_init_complete.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8084}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD debe estar definido en .env}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  student_portal_mysql_data:
  student_portal_vendor_data:
